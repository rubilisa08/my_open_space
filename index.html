<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>my open space — splat viewer</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #111; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,0.55); color: #eee;
    font: 13px/1.5 -apple-system, "Malgun Gothic", sans-serif;
    padding: 10px 14px; border-radius: 8px;
    pointer-events: none; max-width: 60vw;
  }
  #hud b { color: #fff; }

  #drop-hint {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65); color: #fff;
    font: 20px/1.6 -apple-system, "Malgun Gothic", sans-serif;
    text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 0.15s ease;
  }
  #drop-hint.show { opacity: 1; }
  #drop-hint .box {
    border: 2px dashed #fff; border-radius: 12px; padding: 32px 48px;
  }
</style>
</head>
<body>
<div id="hud">불러오는 중…</div>
<div id="drop-hint"><div class="box">여기로 파일을 끌어다 놓으세요<br><span style="font-size:14px;opacity:.8">.ply / .compressed.ply / .sog / .spz</span></div></div>

<script type="importmap">
{
  "imports": {
    "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm"
  }
}
</script>
<script type="module">
import { Application, Asset, AssetListLoader, Entity, FILLMODE_FILL_WINDOW, RESOLUTION_AUTO } from 'playcanvas';

// 확장자 -> 형식 이름 대응표 (과제 요구사항: 셋 다 있어야 함)
const FORMAT_NAME = {
  '.compressed.ply': 'Compressed PLY',
  '.sog': 'SOG',
  '.spz': 'SPZ',
  '.ply': 'PLY (원본)'
};

function detectFormat(filename) {
  const lower = filename.toLowerCase();
  const order = ['.compressed.ply', '.sog', '.spz', '.ply']; // .compressed.ply 를 .ply보다 먼저 검사
  for (const ext of order) {
    if (lower.endsWith(ext)) return { ext, name: FORMAT_NAME[ext] };
  }
  return null;
}

const hud = document.getElementById('hud');
const dropHint = document.getElementById('drop-hint');

function setHud(text) { hud.innerHTML = text; }

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
const app = new Application(canvas, { graphicsDeviceOptions: { antialias: false } });
app.setCanvasFillMode(FILLMODE_FILL_WINDOW);
app.setCanvasResolution(RESOLUTION_AUTO);
app.start();

const camera = new Entity('Camera');
camera.setPosition(0, 0, 2.5);
camera.addComponent('camera', { clearColor: { r: 0.07, g: 0.07, b: 0.07 } });
camera.addComponent('script');
app.root.addChild(camera);

let currentEntity = null;
let currentAsset = null;
let currentObjectUrl = null;

async function loadSplat(url, filename, sizeBytes) {
  const fmt = detectFormat(filename);
  setHud(`불러오는 중… <b>${filename}</b>`);

  // 이전 것 정리
  if (currentEntity) { currentEntity.destroy(); currentEntity = null; }
  if (currentAsset) { app.assets.remove(currentAsset); currentAsset = null; }
  if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
  if (url.startsWith('blob:')) currentObjectUrl = url;

  const assets = [
    new Asset('camera-controls', 'script', {
      url: 'https://cdn.jsdelivr.net/npm/playcanvas/scripts/esm/camera-controls.mjs'
    }),
    new Asset(filename, 'gsplat', { url, filename })
  ];
  const loader = new AssetListLoader(assets, app.assets);
  await new Promise((resolve, reject) => loader.load((err) => err ? reject(err) : resolve()));

  if (!camera.script.cameraControls) {
    camera.script.create('cameraControls');
  }

  currentAsset = assets[1];
  const splat = new Entity(filename);
  splat.addComponent('gsplat', { asset: currentAsset });
  app.root.addChild(splat);
  currentEntity = splat;

  const sizeMb = sizeBytes ? (sizeBytes / (1024 * 1024)).toFixed(2) + ' MB' : '?';
  const count = currentAsset.resource?.gsplatData?.numSplats
    ?? currentAsset.resource?.numSplats
    ?? '?';
  setHud(
    `<b>${filename}</b><br>` +
    `형식: <b>${fmt ? fmt.name : '알 수 없음'}</b> · 크기: ${sizeMb} · 알갱이 수: ${count}<br>` +
    `<span style="opacity:.75">드래그로 회전, 휠로 확대/축소 · 새 파일을 끌어다 놓으면 교체됩니다</span>`
  );
}

// 페이지 로드시 기본 장면을 순서대로 찾아 자동 로드 (sog가 없으면 spz로 대체)
async function loadDefaultScene() {
  for (const name of ['scene.sog', 'scene.compressed.ply']) {
    try {
      const res = await fetch('./' + name, { method: 'HEAD' });
      if (res.ok) {
        const size = Number(res.headers.get('content-length')) || null;
        await loadSplat('./' + name, name, size);
        return;
      }
    } catch (e) { /* try next */ }
  }
  setHud('기본 장면 파일이 없습니다. 파일을 끌어다 놓아 주세요.');
}
loadDefaultScene();

// 드래그 앤 드롭
window.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropHint.classList.add('show');
});
window.addEventListener('dragleave', (e) => {
  if (e.target === document.documentElement || e.clientX <= 0 || e.clientY <= 0) {
    dropHint.classList.remove('show');
  }
});
window.addEventListener('drop', async (e) => {
  e.preventDefault();
  dropHint.classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (!detectFormat(file.name)) {
    setHud(`지원하지 않는 형식입니다: <b>${file.name}</b>`);
    return;
  }
  const url = URL.createObjectURL(file);
  try {
    await loadSplat(url, file.name, file.size);
  } catch (err) {
    setHud(`로드 실패: <b>${file.name}</b><br><span style="opacity:.8">${err}</span>`);
  }
});
</script>
</body>
</html>
